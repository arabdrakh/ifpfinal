name: .NET

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test MoodLog.slnx

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/MoodLog.E2E/MoodLog.E2E.csproj
      - run: pwsh tests/MoodLog.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test tests/MoodLog.E2E/MoodLog.E2E.csproj --no-build
